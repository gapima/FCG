  #     ConnectionStrings__PostgreSql: 'Host=postgres;Port=5432;Database=fiap_cloud_games;Username=postgres;Password=${DB_PASSWORD:-@Testesenha123456}'
  #     Swagger__Enabled: '${SWAGGER_ENABLED:-false}'
  #   ports:
  #     - '${API_PORT:-5080}:8080'
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - cloud_games_network

volumes:
  postgres_data:

networks:
  cloud_games_network:
    driver: bridge
