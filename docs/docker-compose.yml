version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fiap_cloud_games_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${DB_PASSWORD:-@Testesenha123456}'
      POSTGRES_DB: fiap_cloud_games
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud_games_network

  # api:
