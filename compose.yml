name: fiap-cloud-games

x-database-environment: &database-environment
  POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
  POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}

x-application-environment: &application-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY no arquivo .env}

services:
  postgres:
    image: postgres:16-alpine
    container_name: fiap-cloud-games-postgres
    environment:
      <<: *database-environment
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - cloud-games

  migrations:
    image: fiap-cloud-games-migrations:local
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    environment:
      <<: *application-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - cloud-games

  api:
    image: fiap-cloud-games-api:local
    container_name: fiap-cloud-games-api
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      <<: *application-environment
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - cloud-games

volumes:
  postgres_data:
    name: fiap-cloud-games-postgres-data

networks:
  cloud-games:
    name: fiap-cloud-games-network
    driver: bridge
